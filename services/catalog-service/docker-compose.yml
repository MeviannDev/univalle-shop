services:
  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3006
      MONGODB_URI: mongodb://mongo:27017/univalle_catalog?replicaSet=rs0
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-development-only-internal-api-key-change-before-deploy}
    ports:
      - '3006:3006'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3006/api/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - catalog-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}).ok }',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catalog-data:

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  users-service:
    build: .
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deploy-32}
      MONGODB_URI: mongodb://mongodb:27017/univalle_users
      INSTITUTIONAL_EMAIL_DOMAIN: ${INSTITUTIONAL_EMAIL_DOMAIN:-correounivalle.edu.co}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://localhost:3002}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  mongo-data:

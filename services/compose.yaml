services:
  mongodb-payments:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo-payments-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb-recommendations:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - mongo-recommendations-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  payments-service:
    build:
      context: ./payments-service
    restart: unless-stopped
    depends_on:
      mongodb-payments:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb-payments:27017/univalle_payments}
      PAYMENTS_SERVICE_URL: ${PAYMENTS_SERVICE_URL:-http://localhost:3003}

  recommendations-service:
    build:
      context: ./recommendations-service
    restart: unless-stopped
    depends_on:
      mongodb-recommendations:
        condition: service_healthy
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb-recommendations:27017/univalle_recommendations}
      RECOMMENDATIONS_SERVICE_URL: ${RECOMMENDATIONS_SERVICE_URL:-http://localhost:3004}

volumes:
  mongo-payments-data:
  mongo-recommendations-data:

name: Orders closure verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Build and unit/e2e tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            services/orders-service/package-lock.json
            services/catalog-service/package-lock.json
            api-gateway/package-lock.json

      - name: Orders
        working-directory: services/orders-service
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test
          npm run test:e2e

      - name: Catalog
        working-directory: services/catalog-service
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test
          npm run test:e2e

      - name: Gateway
        working-directory: api-gateway
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test
          npm run test:e2e

  compose:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Docker Compose config
        run: docker compose -f services/compose.yaml config --quiet
      - name: Build images
        run: docker compose -f services/compose.yaml build
      - name: Start stack
        run: docker compose -f services/compose.yaml up -d
      - name: Wait for health
        run: |
          timeout 180 bash -c 'until docker compose -f services/compose.yaml ps --format json | jq -s -e "length >= 14 and all(.[]; .Health == \"healthy\")"; do sleep 5; done'
      - name: Compose E2E
        working-directory: api-gateway
        run: npm run test:e2e:compose
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f services/compose.yaml logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose -f services/compose.yaml down
